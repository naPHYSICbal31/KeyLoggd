<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keystroke Dynamics Capture Tool</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.3rem; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input[type=text], select { width: 100%; font-size: 1.1rem; padding: 8px; box-sizing: border-box; }
  input[type=text].locked { background: #eee; }
  button { margin-top: 14px; padding: 8px 16px; font-size: 1rem; cursor: pointer; margin-right: 8px; }
  #status { margin-top: 10px; font-size: 0.95rem; color: #555; }
  #samplesList { margin-top: 16px; font-size: 0.9rem; }
  .sample-ok { color: #1a7a1a; }
  .phrase-display { font-size: 1.2rem; letter-spacing: 1px; background: #f5f5f5; padding: 10px; border-radius: 4px; margin-bottom: 8px; }
  .phrase-row { display: flex; gap: 8px; align-items: center; }
  .phrase-row select { flex: 1; }
  .hint { font-size: 0.85rem; color: #777; margin-top: 4px; }
</style>
</head>
<body>

<h1>Keystroke Dynamics Capture Tool</h1>

<label for="userId">User ID (your name or an ID, no spaces)</label>
<input type="text" id="userId" placeholder="e.g. alice">

<label for="phraseSelect">Phrase to type</label>
<div class="phrase-row">
  <select id="phraseSelect"></select>
  <button id="shuffleBtn" type="button">🔀 Random</button>
</div>
<div class="phrase-display" id="phraseDisplay"></div>

<label for="typedInput">Type the phrase above exactly, then press Enter</label>
<input type="text" id="typedInput" autocomplete="off" spellcheck="false">
<div class="hint">Backspace works normally now — fix mistakes as you type, no need to restart. (Corrections must be made at the end of the text; moving the cursor elsewhere or pasting isn't supported.)</div>

<div id="status">Samples collected this session: <span id="sampleCount">0</span></div>
<div id="samplesList"></div>

<button id="downloadBtn">Download all samples as JSON</button>
<button id="resetBtn">Reset session</button>

<script>
// ---- config ----
// A pool of candidate phrases. Any one of these can be selected per session
// (or per sample, via the dropdown) -- downstream feature extraction
// (fft_features.py etc.) works on raw dwell/flight timing and doesn't care
// which literal phrase was typed, so mixing phrases across samples/users is
// fine and can even be a useful robustness test.
const PHRASES = [
  "the quick brown fox",
  "pack my box with five dozen liquor jugs",
  "how vexingly quick daft zebras jump",
  "the five boxing wizards jump quickly",
  "sphinx of black quartz judge my vow",
  "waltz nymph for quick jigs vex bud",
  "bright vixens jump dozy fowl quack",
  "jinxed wizards pluck ivy from the big quilt",
  "two driven jocks help fax my big quiz",
  "quick zephyrs blow vexing daft jim",
  "my ex pub quiz crowd finally won jackpot",
  "grumpy wizards make toxic brew for the jovial queen",
];

const MIN_SAMPLES_SUGGESTED = 12;

const phraseSelect = document.getElementById("phraseSelect");
const phraseDisplay = document.getElementById("phraseDisplay");

PHRASES.forEach((p, i) => {
  const opt = document.createElement("option");
  opt.value = p;
  opt.textContent = p;
  phraseSelect.appendChild(opt);
});

function currentPhrase() {
  return phraseSelect.value;
}

function setPhrase(p) {
  phraseSelect.value = p;
  phraseDisplay.textContent = p;
  resetCurrentTyping();
}

phraseSelect.value = PHRASES[0];
phraseDisplay.textContent = PHRASES[0];

document.getElementById("shuffleBtn").addEventListener("click", () => {
  const p = PHRASES[Math.floor(Math.random() * PHRASES.length)];
  setPhrase(p);
});

phraseSelect.addEventListener("change", () => {
  phraseDisplay.textContent = currentPhrase();
  resetCurrentTyping();
});

// ---- state ----
let samples = [];        // one entry per completed repetition: {events, phrase}
let sessionStartPerf = null;

// pendingDowns: key -> down timestamp, for a keypress that hasn't seen its
// keyup yet (needed so we can correctly pair down/up even with fast typing)
let pendingDowns = {};

// activeKeyEvents: ordered list of completed {key, down, up} entries that
// currently make up the visible text in the input box. This is the actual
// source of truth for the signal we build -- pressing Backspace pops the
// last entry off instead of wiping the whole thing, so a corrected sample
// still contributes real timing data (including the natural pause before
// catching/fixing a mistake, which is itself a meaningful timing feature).
let activeKeyEvents = [];

const typedInput = document.getElementById("typedInput");
const userIdInput = document.getElementById("userId");
const sampleCountEl = document.getElementById("sampleCount");
const samplesListEl = document.getElementById("samplesList");

function resetCurrentTyping() {
  pendingDowns = {};
  activeKeyEvents = [];
  sessionStartPerf = null;
  typedInput.value = "";
}

function nowRelative() {
  if (sessionStartPerf === null) sessionStartPerf = performance.now();
  return (performance.now() - sessionStartPerf) / 1000.0;
}

typedInput.addEventListener("keydown", (e) => {
  // ignore key-repeat (held-down key auto-repeat) so we don't push
  // duplicate/garbage timing entries
  if (e.repeat) return;

  if (e.key === "Enter") {
    e.preventDefault();
    submitSample();
    return;
  }

  if (e.key === "Backspace") {
    // pop the most recent completed character off the active signal,
    // mirroring what the browser is about to delete from the input value.
    // we let the browser handle the actual text deletion natively.
    if (activeKeyEvents.length > 0) activeKeyEvents.pop();
    return;
  }

  // only track single printable characters (length === 1 covers letters,
  // numbers, space, punctuation -- excludes Shift/Control/ArrowLeft/etc.)
  if (e.key.length !== 1) return;

  const t = nowRelative();
  pendingDowns[e.key] = t;
});

typedInput.addEventListener("keyup", (e) => {
  if (e.key.length !== 1) return;
  if (!(e.key in pendingDowns)) return; // no matching down (e.g. we ignored a repeat)

  const t = nowRelative();
  const downT = pendingDowns[e.key];
  delete pendingDowns[e.key];

  activeKeyEvents.push({ key: e.key, down: downT, up: t });
});

function activeEventsToFlatList() {
  // flatten activeKeyEvents back into the {key, type, t} event stream that
  // signal_construction.py expects, in chronological order.
  const out = [];
  for (const entry of activeKeyEvents) {
    out.push({ key: entry.key, type: "down", t: entry.down });
    out.push({ key: entry.key, type: "up", t: entry.up });
  }
  return out;
}

function submitSample() {
  const typedText = typedInput.value;
  const phrase = currentPhrase();

  if (typedText !== phrase) {
    alert("Typed text didn't exactly match the phrase. Please retry.\nExpected: \"" + phrase + "\"\nGot: \"" + typedText + "\"");
    resetCurrentTyping();
    return;
  }
  if (activeKeyEvents.length !== typedText.length) {
    // safety net: this can happen if the user did something we don't
    // track (e.g. select-all + delete, cursor moved mid-string, paste).
    // Rather than silently record a misaligned signal, ask for a clean retry.
    alert("Couldn't reliably track that input (try avoiding paste / moving the cursor mid-word). Please retype from scratch.");
    resetCurrentTyping();
    return;
  }
  if (!userIdInput.value.trim()) {
    alert("Please enter a User ID before recording samples.");
    resetCurrentTyping();
    return;
  }

  samples.push({ events: activeEventsToFlatList(), phrase: phrase });
  sampleCountEl.textContent = samples.length;

  const li = document.createElement("div");
  li.className = "sample-ok";
  li.textContent = "✓ Sample " + samples.length + " recorded (" + activeKeyEvents.length + " chars, phrase: \"" + phrase + "\")";
  samplesListEl.prepend(li);

  resetCurrentTyping();

  if (samples.length === MIN_SAMPLES_SUGGESTED) {
    alert("You've recorded " + MIN_SAMPLES_SUGGESTED + " samples — that's a good minimum. You can keep going or download now.");
  }
}

document.getElementById("downloadBtn").addEventListener("click", () => {
  if (samples.length === 0) {
    alert("No samples recorded yet.");
    return;
  }
  const userId = userIdInput.value.trim() || "unknown_user";
  // top-level "phrase" kept for backward-compat with scripts that only
  // read a single phrase; each sample also carries its own "phrase" field
  // in case multiple phrases were used within one session.
  const record = { user_id: userId, phrase: samples[samples.length - 1].phrase, samples: samples };

  const blob = new Blob([JSON.stringify(record, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = userId + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Clear all recorded samples for this session?")) return;
  samples = [];
  sampleCountEl.textContent = "0";
  samplesListEl.innerHTML = "";
  resetCurrentTyping();
});
</script>

</body>
</html>
